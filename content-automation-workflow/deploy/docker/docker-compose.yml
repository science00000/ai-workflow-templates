version: "3.9"

services:
  # ── FastAPI Content API ──────────────────────────────────
  app:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile
    container_name: content-automation-app
    ports:
      - "8000:8000"
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama3.2}
      - LLM_BACKEND=ollama
    volumes:
      - ../data:/app/data
    depends_on:
      ollama:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Ollama (Local LLM) ───────────────────────────────────
  ollama:
    image: ollama/ollama:latest
    container_name: content-automation-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c", "ollama pull ${OLLAMA_MODEL:-llama3.2} && ollama serve"]

  # ── n8n (Workflow Automation) ────────────────────────────
  n8n:
    image: n8nio/n8n:latest
    container_name: content-automation-n8n
    ports:
      - "5678:5678"
    environment:
      - CONTENT_API_URL=http://app:8000
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - GENERIC_TIMEZONE=UTC
    volumes:
      - n8n-data:/home/node/.n8n
      - ../n8n/workflows:/import
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

volumes:
  ollama-data:
  n8n-data:
