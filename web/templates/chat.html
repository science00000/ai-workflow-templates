<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Customer Support</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f7fa; height: 100vh; display: flex; align-items: center; justify-content: center; }
    .chat-container { width: 480px; max-width: 95vw; background: #fff; border-radius: 16px; box-shadow: 0 4px 24px rgba(0,0,0,0.1); overflow: hidden; display: flex; flex-direction: column; height: 600px; }
    .chat-header { background: linear-gradient(135deg, #667eea, #764ba2); color: #fff; padding: 20px; text-align: center; }
    .chat-header h1 { font-size: 18px; font-weight: 600; }
    .chat-header p { font-size: 12px; opacity: 0.8; margin-top: 4px; }
    .chat-messages { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
    .message { max-width: 80%; padding: 10px 14px; border-radius: 12px; font-size: 14px; line-height: 1.5; }
    .message.bot { background: #f0f2f5; align-self: flex-start; border-bottom-left-radius: 4px; }
    .message.user { background: #667eea; color: #fff; align-self: flex-end; border-bottom-right-radius: 4px; }
    .message .sources { font-size: 11px; opacity: 0.6; margin-top: 4px; }
    .chat-input { display: flex; gap: 8px; padding: 16px; border-top: 1px solid #eee; }
    .chat-input input { flex: 1; padding: 10px 14px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; outline: none; }
    .chat-input input:focus { border-color: #667eea; }
    .chat-input button { padding: 10px 20px; background: #667eea; color: #fff; border: none; border-radius: 8px; font-size: 14px; cursor: pointer; }
    .chat-input button:hover { background: #5a6fd6; }
    .typing { font-style: italic; color: #999; font-size: 13px; padding-left: 4px; }
  </style>
</head>
<body>
  <div class="chat-container">
    <div class="chat-header">
      <h1>🤖 AI Support Assistant</h1>
      <p>We typically reply instantly</p>
    </div>
    <div class="chat-messages" id="messages">
      <div class="message bot">Hi there! 👋 How can I help you today?</div>
    </div>
    <div class="chat-input">
      <input type="text" id="input" placeholder="Type your question..." autofocus>
      <button onclick="sendMessage()">Send</button>
    </div>
  </div>

  <script>
    const messages = document.getElementById('messages');
    const input = document.getElementById('input');

    input.addEventListener('keypress', (e) => { if (e.key === 'Enter') sendMessage(); });

    async function sendMessage() {
      const text = input.value.trim();
      if (!text) return;

      // Show user message
      appendMessage(text, 'user');
      input.value = '';

      // Show typing indicator
      const typing = document.createElement('div');
      typing.className = 'typing';
      typing.textContent = 'Thinking...';
      messages.appendChild(typing);
      messages.scrollTop = messages.scrollHeight;

      try {
        const res = await fetch('/api/chat/', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: text })
        });
        const data = await res.json();

        typing.remove();
        let sourcesHtml = data.sources?.length ? `<div class="sources">📚 ${data.sources.join(', ')}</div>` : '';
        appendMessage(data.response + sourcesHtml, 'bot', true);
      } catch (err) {
        typing.remove();
        appendMessage('Sorry, something went wrong. Please try again.', 'bot');
      }
    }

    function appendMessage(text, role, html = false) {
      const div = document.createElement('div');
      div.className = `message ${role}`;
      if (html) div.innerHTML = text;
      else div.textContent = text;
      messages.appendChild(div);
      messages.scrollTop = messages.scrollHeight;
    }
  </script>
</body>
</html>
